name: PFT
display_name: PFT Toolkit
schema_version: 0.2.1
contributions:
  commands:
    - id: PFT.read_image
      title: Read PFT microscopy image
      python_name: PFT.napari.reader:napari_get_reader
    - id: PFT.denoise_widget
      title: PFT denoising / restoration
      python_name: PFT.napari.denoise_widget:make_denoise_widget
    - id: PFT.segmentation_widget
      title: PFT segmentation
      python_name: PFT.napari.segmentation_widget:make_segmentation_widget
    - id: PFT.results_widget
      title: PFT results / statistics
      python_name: PFT.napari.results_widget:make_results_widget
  readers:
    - command: PFT.read_image
      filename_patterns:
        - "*.czi"
        - "*.tif"
        - "*.tiff"
        - "*.ome.tif"
        - "*.ome.tiff"
        - "*.zarr"
        - "*.ome.zarr"
      accepts_directories: true
  widgets:
    - command: PFT.denoise_widget
      display_name: PFT denoising / restoration
    - command: PFT.segmentation_widget
      display_name: PFT segmentation
    - command: PFT.results_widget
      display_name: PFT results / statistics
