[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PFT"
version = "0.1.0"
description = "Pneumo-Fluor Toolkit (PFT)"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "PFT contributors" },
]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "tifffile>=2023.9.26",
  "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/"

[project.scripts]
pft-psf = "PFT.core_prog_parts.psf_creator:main"
pft-dl2 = "PFT.core_prog_parts.dl2:main"
pft-fiji = "PFT.core_prog_parts.fuji_managment:main"
pft-n2v-train = "PFT.core_prog_parts.n2v_train_models:main"
pft-tune-notch = "PFT.core_prog_parts.tune_notch:main"
pft-tune-freehand = "PFT.core_prog_parts.tune_freehand:main"
pft-sanity-2d = "PFT.core_prog_parts.sanity_2d:main"
pft-sanity-3d = "PFT.core_prog_parts.sanity_3d:main"
pft-check-2d = "PFT.core_prog_parts.check_2d:main"
pft-check-3d = "PFT.core_prog_parts.check_3d:main"
pft-check-3d-psf-suff = "PFT.core_prog_parts.check_3d_psf_suff:main"
pft-collage = "PFT.core_prog_parts.collage:main"
pft-collect-training-omezarr = "PFT.core_prog_parts.collect_training_omezarr:main"
pft-compare-deconvolve = "PFT.core_prog_parts.compare_deconvolve:main"
pft-create-psf = "PFT.core_prog_parts.create_psf:main"
pft-damp-meta = "PFT.core_prog_parts.damp_meta:main"
pft-deconvolve-3d = "PFT.core_prog_parts.deconvolve_3d:main"
pft-fft = "PFT.core_prog_parts.FFT:main"
pft-fft-3d = "PFT.core_prog_parts.FFT_3d:main"
pft-n2v-validation = "PFT.core_prog_parts.n2v_validation:main"
pft-noise-checks = "PFT.core_prog_parts.noise_checks:main"
pft-normalization-psf = "PFT.core_prog_parts.normalizarion_PSF:main"
pft-patches = "PFT.core_prog_parts.patches:main"
pft-process-czi = "PFT.core_prog_parts.process_czi:main"
pft-psf-checks = "PFT.core_prog_parts.PSF_checks:main"

[project.entry-points."napari.manifest"]
PFT = "PFT.napari:napari.yaml"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"PFT" = [
  "napari/napari.yaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.optional-dependencies]
io = [
  "czifile",
  "imageio>=2.31",
  "matplotlib",
  "ome-zarr>=0.11,<0.12",
  "pillow",
  "scikit-image>=0.22",
  "zarr>=2.16,<3",
  "numcodecs",
  "dask",
  "pandas",
]

ml = [
  "tensorflow",
  "csbdeep",
  "n2v",
]

napari = [
  "napari[all]>=0.6",
]

cellpose = [
  "cellpose",
]

segmentation = [
  "cellpose",
  "stardist",
  "csbdeep",
  "scikit-image>=0.22",
]

dev = [
  "pytest",
  "ruff",
  "black",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".venv",
  "venv",
  "build",
  "dist",
  "results",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
