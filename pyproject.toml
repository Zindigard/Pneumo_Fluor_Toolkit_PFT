[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PFT"
version = "0.1.0"
description = "Pneumo-Fluor Toolkit for fluorescence microscopy processing and analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "PFT contributors" },
]
requires-python = ">=3.10,<3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: napari",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Processing",
]

# Dependencies needed by the non-deep-learning pipeline, OME-Zarr I/O,
# visualization, deconvolution, filtering, and statistical analysis.
dependencies = [
  "numpy>=1.23.5,<2",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "statsmodels>=0.14,<0.15",
  "matplotlib>=3.7,<4",
  "pillow>=10,<12",
  "imageio>=2.31,<3",
  "tifffile>=2023.9.26,<2027",
  "scikit-image>=0.22,<0.26",
  "czifile>=2019.7.2",
  "ome-zarr>=0.11,<0.12",
  "zarr>=2.16,<3",
  "numcodecs>=0.11,<1",
  "dask[array]>=2023.9,<2027",
  "psutil>=5.9,<8",
]

[project.urls]
Homepage = "https://github.com/Zindigard/Pneumo_Fluor_Toolkit_PFT"
Repository = "https://github.com/Zindigard/Pneumo_Fluor_Toolkit_PFT"
Issues = "https://github.com/Zindigard/Pneumo_Fluor_Toolkit_PFT/issues"

# Commands implemented in categorized core processing subpackages.
[project.scripts]
pft-psf = "PFT.core_prog_parts.denoising.psf_creator:main"
pft-dl2 = "PFT.core_prog_parts.denoising.dl2:main"
pft-fiji = "PFT.core_prog_parts.denoising.fuji_managment:main"
pft-denoise = "PFT.core_prog_parts.denoising.denoiser:main"
pft-intensity = "PFT.core_prog_parts.statistics.intenisty:main"
pft-n2v-train = "PFT.core_prog_parts.denoising.n2v_train_models:main"
pft-tune-notch = "PFT.core_prog_parts.denoising.tune_notch:main"
pft-tune-freehand = "PFT.core_prog_parts.denoising.tune_freehand:main"

# Terminal wrappers stored in categorized repository-root scripts subpackages.
pft-fft = "scripts.denoising.FFT:main"
pft-fft-3d = "scripts.denoising.FFT_3d:main"
pft-psf-checks = "scripts.denoising.PSF_checks:main"
pft-check-2d = "scripts.denoising.check_2d:main"
pft-check-3d-psf-suff = "scripts.denoising.check_3d_psf_suff:main"
pft-collect-training-omezarr = "scripts.segmentation.collect_training_omezarr:main"
pft-create-psf = "scripts.denoising.create_psf:main"
pft-results-graphs = "scripts.statistics.create_results_graphs:main"
pft-results-statistics = "scripts.statistics.create_results_statistics:main"
pft-thesis-graphs = "scripts.statistics.create_thesis_graphs:main"
pft-damp-meta = "scripts.denoising.damp_meta:main"
pft-deconvolve-3d = "scripts.denoising.deconvolve_3d:main"
pft-deconvolve-3d-v2 = "scripts.denoising.deconvolve_3d_v2:main"
pft-intensity-3d = "scripts.statistics.intensity_distribution_3d:main"
pft-n2v-validation = "scripts.denoising.n2v_validation:main"
pft-visualize = "scripts.denoising.visualization_export:main"
pft-normalization-psf = "scripts.denoising.normalizarion_PSF:main"
pft-process-czi = "scripts.denoising.process_czi:main"
pft-run-cellpose = "scripts.segmentation.run_cellpose_terminal:main"
pft-run-microbj = "scripts.segmentation.run_microbj:main"
pft-run-omnipose = "scripts.segmentation.run_omnipose_terminal:main"
pft-run-pca-mask = "scripts.statistics.run_pca_mask_terminal:main"
pft-run-stardist = "scripts.segmentation.run_stardist_terminal:main"
pft-run-unet = "scripts.segmentation.run_unet_terminal:main"
pft-run-yolo = "scripts.segmentation.run_yolo_terminal:main"
pft-sanity-2d = "scripts.denoising.sanity_2d:main"
pft-sanity-3d = "scripts.denoising.sanity_3d:main"
pft-segmentation = "scripts.segmentation.segmentation_launcher:main"
pft-train-cellpose = "scripts.segmentation.train_cellpose_terminal:main"
pft-train-omnipose = "scripts.segmentation.train_omnipose_terminal:main"
pft-train-stardist = "scripts.segmentation.train_stardist_terminal:main"
pft-train-unet = "scripts.segmentation.train_unet_terminal:main"
pft-train-yolo = "scripts.segmentation.train_yolo_terminal:main"
pft-yolo-launcher = "scripts.segmentation.yolo_launcher:main"

[project.entry-points."napari.manifest"]
PFT = "PFT.napari:napari.yaml"

[project.optional-dependencies]
# BM3D denoising.
bm3d = [
  "bm3d>=4,<5",
]

# TensorFlow U-Net training and inference.
unet = [
  "tensorflow>=2.13,<2.16",
  "keras>=2.13,<3",
  "opencv-python>=4.8,<5",
]

# Noise2Void. N2V is not compatible with TensorFlow 2.16+.
n2v = [
  "tensorflow>=2.13,<2.16",
  "keras>=2.13,<3",
  "csbdeep>=0.7.4,<0.9",
  "n2v>=0.3,<0.4",
]

# Cellpose 3.x is required because the current code uses APIs removed in Cellpose 4.
cellpose = [
  "cellpose>=3,<4",
  "torch>=2.1,<3",
  "opencv-python>=4.8,<5",
]

# Omnipose and its cellpose_omni compatibility package.
omnipose = [
  "omnipose>=1.1,<2",
  "cellpose>=3,<4",
  "torch>=2.1,<3",
  "opencv-python>=4.8,<5",
]

# StarDist uses TensorFlow and CSBDeep.
stardist = [
  "tensorflow>=2.13,<2.16",
  "keras>=2.13,<3",
  "csbdeep>=0.7.4,<0.9",
  "stardist>=0.9,<1",
]

# Ultralytics YOLO training and inference.
yolo = [
  "ultralytics>=8,<9",
  "torch>=2.1,<3",
  "opencv-python>=4.8,<5",
  "pyyaml>=6,<7",
]

# napari application and OME-Zarr reader support.
napari = [
  "napari[all]>=0.6,<0.7",
  "napari-ome-zarr",
]

# Complete CPU-oriented thesis environment. For CUDA, install the correct
# PyTorch build first, then install this project with the same extra.
all = [
  "bm3d>=4,<5",
  "tensorflow>=2.13,<2.16",
  "keras>=2.13,<3",
  "csbdeep>=0.7.4,<0.9",
  "n2v>=0.3,<0.4",
  "cellpose>=3,<4",
  "omnipose>=1.1,<2",
  "stardist>=0.9,<1",
  "ultralytics>=8,<9",
  "torch>=2.1,<3",
  "opencv-python>=4.8,<5",
  "pyyaml>=6,<7",
  "napari[all]>=0.6,<0.7",
  "napari-ome-zarr",
]

dev = [
  "build>=1.2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "black>=24,<27",
]

[tool.setuptools]
# The importable PFT package remains under src/PFT, while command wrappers
# remain in the repository-root scripts directory.
package-dir = { "PFT" = "src/PFT", "scripts" = "scripts" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["PFT*", "scripts*"]
namespaces = true

[tool.setuptools.package-data]
"PFT" = [
  "napari/napari.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".venv",
  "venv",
  "build",
  "dist",
  "results",
  "models",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
