[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PFT"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
]

[project.entry-points."napari.manifest"]
PFT = "PFT.napari:napari.yaml"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.optional-dependencies]
io = [
  "czifile",
  "matplotlib",
  "imageio>=2.31",
  "scikit-image>=0.22",
  "ome-zarr>=0.11,<0.12",
  "zarr>=2.16,<3",
  "numcodecs",
  "dask",
]

ml = [
  "tensorflow",
  "csbdeep",
  "n2v",
]

napari = [
  "napari[all]>=0.6",
]

cellpose = [
  "cellpose",
]

dev = [
  "pytest",
  "ruff",
  "black",
]
