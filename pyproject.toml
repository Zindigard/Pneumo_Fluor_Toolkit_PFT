[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PFT"
version = "0.1.0"
description = "Reproducible fluorescence-microscopy processing and single-cell analysis for Streptococcus pneumoniae"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "PFT contributors" },
]
requires-python = ">=3.10,<3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: napari",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
]

# Main PFT environment:
# - CZI and OME-Zarr processing
# - filtering, deconvolution, visualization, and statistics
# - Cellpose 3 as the primary instance-segmentation method
#
# StarDist and Omnipose remain isolated in dedicated environments because their
# tested TensorFlow/CUDA and cellpose_omni dependency stacks are different.
dependencies = [
  "numpy>=1.23.5,<2",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "statsmodels>=0.14,<0.15",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "pillow>=10,<12",
  "imageio>=2.31,<3",
  "tifffile>=2023.9.26,<2027",
  "scikit-image>=0.21,<0.26",
  "czifile>=2019.7.2",
  "ome-zarr>=0.9,<0.12",
  "zarr>=2.15,<3",
  "numcodecs>=0.11,<1",
  "dask[array]>=2023.12,<2027",
  "distributed>=2023.12,<2027",
  "fsspec>=2023.6,<2027",
  "psutil>=5.9,<8",
  "pyyaml>=6,<7",
  "requests>=2.31,<3",
  "tqdm>=4.66,<5",
  "opencv-python>=4.8,<5",
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "cellpose==3.1.1.2",
]

[project.urls]
Homepage = "https://github.com/Zindigard/Pneumo_Fluor_Toolkit_PFT"
Repository = "https://github.com/Zindigard/Pneumo_Fluor_Toolkit_PFT"
Issues = "https://github.com/Zindigard/Pneumo_Fluor_Toolkit_PFT/issues"

# Commands implemented in categorized core processing subpackages.
[project.scripts]
pft-psf = "PFT.core_prog_parts.denoising.psf_creator:main"
pft-dl2 = "PFT.core_prog_parts.denoising.dl2:main"
pft-fiji = "PFT.core_prog_parts.denoising.fuji_managment:main"
pft-denoise = "PFT.core_prog_parts.denoising.denoiser:main"
pft-intensity = "PFT.core_prog_parts.statistics.intenisty:main"
pft-n2v-train = "PFT.core_prog_parts.denoising.n2v_train_models:main"
pft-tune-notch = "PFT.core_prog_parts.denoising.tune_notch:main"
pft-tune-freehand = "PFT.core_prog_parts.denoising.tune_freehand:main"

# Terminal wrappers stored under the repository-root scripts package.
pft-fft = "scripts.denoising.FFT:main"
pft-fft-3d = "scripts.denoising.FFT_3d:main"
pft-psf-checks = "scripts.denoising.PSF_checks:main"
pft-check-2d = "scripts.denoising.check_2d:main"
pft-check-3d-psf-suff = "scripts.denoising.check_3d_psf_suff:main"
pft-collect-training-omezarr = "scripts.segmentation.collect_training_omezarr:main"
pft-create-psf = "scripts.denoising.create_psf:main"
pft-results-graphs = "scripts.statistics.create_results_graphs:main"
pft-results-statistics = "scripts.statistics.create_results_statistics:main"
pft-thesis-graphs = "scripts.statistics.create_thesis_graphs:main"
pft-damp-meta = "scripts.denoising.damp_meta:main"
pft-deconvolve-3d = "scripts.denoising.deconvolve_3d:main"
pft-deconvolve-3d-v2 = "scripts.denoising.deconvolve_3d_v2:main"
pft-intensity-3d = "scripts.statistics.intensity_distribution_3d:main"
pft-n2v-validation = "scripts.denoising.n2v_validation:main"
pft-visualize = "scripts.denoising.visualization_export:main"
pft-normalization-psf = "scripts.denoising.normalizarion_PSF:main"
pft-process-czi = "scripts.denoising.process_czi:main"
pft-run-cellpose = "scripts.segmentation.run_cellpose_terminal:main"
pft-run-microbj = "scripts.segmentation.run_microbj:main"
pft-run-omnipose = "scripts.segmentation.run_omnipose_terminal:main"
pft-run-pca-mask = "scripts.statistics.run_pca_mask_terminal:main"
pft-run-stardist = "scripts.segmentation.run_stardist_terminal:main"
pft-run-unet = "scripts.segmentation.run_unet_terminal:main"
pft-run-yolo = "scripts.segmentation.run_yolo_terminal:main"
pft-sanity-2d = "scripts.denoising.sanity_2d:main"
pft-sanity-3d = "scripts.denoising.sanity_3d:main"
pft-segmentation = "scripts.segmentation.segmentation_launcher:main"
pft-train-cellpose = "scripts.segmentation.train_cellpose_terminal:main"
pft-train-omnipose = "scripts.segmentation.train_omnipose_terminal:main"
pft-train-stardist = "scripts.segmentation.train_stardist_terminal:main"
pft-train-unet = "scripts.segmentation.train_unet_terminal:main"
pft-train-yolo = "scripts.segmentation.train_yolo_terminal:main"
pft-yolo-launcher = "scripts.segmentation.yolo_launcher:main"

[project.entry-points."napari.manifest"]
PFT = "PFT.napari:napari.yaml"

[project.optional-dependencies]
# TensorFlow U-Net on Python 3.10. TensorFlow 2.10.1 is retained because it is
# the last release with native-Windows NVIDIA GPU support.
unet = [
  "tensorflow==2.10.1",
  "keras==2.10.0",
  "protobuf>=3.9.2,<3.20",
  "h5py>=3.7,<4",
]

# Noise2Void uses the same TensorFlow generation as the current U-Net workflow.
n2v = [
  "tensorflow==2.10.1",
  "keras==2.10.0",
  "protobuf>=3.9.2,<3.20",
  "csbdeep==0.8.2",
  "n2v>=0.3,<0.4",
]

# Tested StarDist environment. Use PFT_environment_setup.txt rather than adding
# this stack to the main pft environment.
stardist = [
  "numpy==1.23.5",
  "scipy==1.10.1",
  "scikit-image==0.21.0",
  "tensorflow==2.10.1",
  "keras==2.10.0",
  "protobuf>=3.9.2,<3.20",
  "csbdeep==0.8.2",
  "stardist==0.9.2",
  "ome-zarr==0.9.0",
  "zarr==2.16.1",
  "numcodecs==0.11.0",
  "dask[array]==2023.12.1",
  "distributed==2023.12.1",
]

# Tested Omnipose environment. CUDA-enabled PyTorch and CUDA NVRTC are installed
# with conda before these packages. The project is then installed with --no-deps.
omnipose = [
  "numpy==1.26.4",
  "omnipose==1.1.4",
  "aicsimageio==4.14.0",
  "dask-image==2026.5.0",
  "ome-zarr==0.9.0",
  "zarr==2.15.0",
  "numcodecs==0.11.0",
  "dask[array]==2024.4.1",
  "distributed==2024.4.1",
  "fsspec==2023.6.0",
  "s3fs==2023.6.0",
  "urllib3==1.26.20",
]

# BM3D denoising.
bm3d = [
  "bm3d>=4,<5",
]

# Ultralytics YOLO training and inference.
yolo = [
  "ultralytics>=8,<9",
]

# napari application and OME-Zarr reader support.
napari = [
  "napari[all]>=0.6,<0.7",
  "napari-ome-zarr",
]

dev = [
  "build>=1.2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "black>=24,<27",
]

[tool.setuptools]
# The importable PFT package is under src/PFT. User-facing command wrappers are
# retained under the repository-root scripts directory.
package-dir = { "PFT" = "src/PFT", "scripts" = "scripts" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["PFT*", "scripts*"]
namespaces = true

[tool.setuptools.package-data]
"PFT" = [
  "napari/napari.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".venv",
  "venv",
  "build",
  "dist",
  "results",
  "models",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
